[theme]
primaryColor = "#E87722"
backgroundColor = "#081325"
secondaryBackgroundColor = "#16344f"
textColor = "#F6F4E9"
font = "sans serif"

[server]
headless = true
# Saving the shared bull list / earnings cache writes under data/.
# Don't treat those writes as source changes or Streamlit will rerun
# mid-save and drop the names that were just added.
folderWatchBlacklist = ["data", "data/", ".streamlit"]
